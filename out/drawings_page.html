<text x="900.00" y="496.00" class="note" text-anchor="start">1. 規範：交通部公路橋梁設計規範（98 年版及 104、109 年修訂）、</text>
<text x="900.00" y="521.00" class="note" text-anchor="start">   公路橋梁耐震設計規範（107 年 12 月版）。</text>
<text x="900.00" y="546.00" class="note" text-anchor="start">2. 活載重：HS20-44(MS18)；衝擊 I = 15.24/(L+38.1)，跨中 0.195。</text>
<text x="900.00" y="571.00" class="note" text-anchor="start">3. 設計法：強度 1.3[D + 1.67(L+I)]；預力構件另檢核施工與使用應力。</text>
<text x="900.00" y="596.00" class="note" text-anchor="start">4. 用途係數 I = 1.0；設計年限 50 年；一般環境（離海岸 &gt; 3 km）。</text>
<text x="900.00" y="621.00" class="note" text-anchor="start">5. 橋址：台中市南屯區；第二類地盤（Vs30 取 180 m/s，無地質資料）。</text>
<text x="900.00" y="646.00" class="note" text-anchor="start">   等級 II：SS = 0.92、S1 = 0.743（含近斷層 NA 1.15、NV 1.18）。</text>
<text x="900.00" y="671.00" class="hdr" text-anchor="start">材料</text>
<text x="900.00" y="696.00" class="note" text-anchor="start">6. 梁混凝土 f'c = 35 MPa，施預力時 f'ci ≥ 30 MPa；</text>
<text x="900.00" y="721.00" class="note" text-anchor="start">   橋面版 f'c = 28 MPa；鋼筋 SD420W。</text>
<text x="900.00" y="746.00" class="note" text-anchor="start">7. 預力鋼材：15.2 mm 七線低鬆弛鋼絞線，f's = 1860 MPa；</text>
<text x="900.00" y="771.00" class="note" text-anchor="start">   4 束 × 10 股，套管內徑 85 mm，完成後全長灌漿。</text>
<text x="900.00" y="796.00" class="note" text-anchor="start">8. 保護層：版頂 50、版底 35、梁箍筋 40 mm。</text>
<text x="900.00" y="821.00" class="hdr" text-anchor="start">主要結果（每支梁）</text>
<text x="900.00" y="846.00" class="note" text-anchor="start">9. Mu = 15,686 kN·m ≤ φMn = 19,894 kN·m（φ = 0.95）。</text>
<text x="900.00" y="871.00" class="note" text-anchor="start">10. 使用載重梁底應力 +2.01 MPa ≤ 2.95 MPa。</text>
<text x="900.00" y="896.00" class="note" text-anchor="start">11. 活載重撓度 10.8 mm ≤ L/800 = 50 mm。</text>

<text x="1060.00" y="650.00" class="hdr" text-anchor="start">預力施工說明</text>
<text x="1060.00" y="676.00" class="note" text-anchor="start">1. 4 束 × 10 股 15.2 mm 低鬆弛鋼絞線，Aps = 5,600 mm²。</text>
<text x="1060.00" y="700.00" class="note" text-anchor="start">2. 單端張拉、左右交替，依 T1→T2→T3→T4 順序。</text>
<text x="1060.00" y="724.00" class="note" text-anchor="start">   T1：左端張拉 1429 MPa（0.768 f's），伸長約 281 mm</text>
<text x="1060.00" y="748.00" class="note" text-anchor="start">   T2：右端張拉 1418 MPa（0.762 f's），伸長約 282 mm</text>
<text x="1060.00" y="772.00" class="note" text-anchor="start">   T3：左端張拉 1411 MPa（0.758 f's），伸長約 282 mm</text>
<text x="1060.00" y="796.00" class="note" text-anchor="start">   T4：右端張拉 1399 MPa（0.752 f's），伸長約 282 mm</text>
<text x="1060.00" y="820.00" class="note" text-anchor="start">3. 錨碇滑動 6 mm；錨碇後端錨 ≤ 0.70 f's、</text>
<text x="1060.00" y="844.00" class="note" text-anchor="start">   滑動影響範圍末端 ≤ 0.83 fy*（8.15.1）。</text>
<text x="1060.00" y="868.00" class="note" text-anchor="start">4. 摩擦 K = 0.0007 /m、μ = 0.25（鍍鋅金屬套管）。</text>
<text x="1060.00" y="892.00" class="note" text-anchor="start">5. 施預力時梁混凝土 f'ci ≥ 30 MPa。</text>
<text x="1060.00" y="916.00" class="note" text-anchor="start">6. 損失（跨中）224 MPa；有效預力 Pe ≈ 6,198 kN。</text>
<text x="1060.00" y="940.00" class="note" text-anchor="start">7. 張拉完成後 48 小時內以無收縮水泥漿全長灌漿。</text>
<text x="1060.00" y="964.00" class="note" text-anchor="start">8. 預拱：張拉時跨中上拱約 39 mm。</text>
<text x="1060.00" y="988.00" class="note" text-anchor="start">9. 張拉力與伸長量差異超過 ±7% 時應停工檢討。</text></svg></div></section><section class="sheet" id="sheet-s03" aria-label="S-03 配筋、支承與耐震配置" hidden><div class="scroller"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1188" width="1680" height="1188" role="img" aria-label="S-03 配筋、支承與耐震配置"><style>

<script>
(function () {
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const sheets = Array.from(document.querySelectorAll('.sheet'));
  let zoom = '1';
  function show(id) {
    tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.sheet === id)));
    sheets.forEach(s => { s.hidden = s.id !== 'sheet-' + id; s.dataset.zoom = zoom; });
  }
  tabs.forEach(t => t.addEventListener('click', () => {
    show(t.dataset.sheet);
    try { history.replaceState(null, '', '#' + t.dataset.sheet); } catch (e) {}
  }));
  document.querySelectorAll('.zoom button').forEach(b => b.addEventListener('click', () => {
    zoom = b.dataset.z;
    document.querySelectorAll('.zoom button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    sheets.forEach(s => s.dataset.zoom = zoom);
  }));
  const h = (location.hash || '').slice(1);
  show(tabs.some(t => t.dataset.sheet === h) ? h : tabs[0].dataset.sheet);
})();
</script>
